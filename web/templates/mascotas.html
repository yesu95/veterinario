{% extends 'index.html' %}
{% block content %}
<h2>Macotas</h2>
<ul>
    {% for elemento in mascotas %}
    <li>
        {{ elemento.name }}
    </li>
    {% endfor %}
</ul>
{% if user.is_authenticated and user.is_staff %}
<a href="{% url 'crear mascota' %}">Crear Mascota</a>
{% endif %}
{% endblock %}
