{% extends 'index.html' %}
{% load static %}

{% block content %}
<div class="login-page-container">

    <div class="login-wrapper">

        <div class="login-content">
            <section class="section-login">
                <h1 class="title-xl">Animalia</h1>
                <p class="text-m">
                    Bienvenido a tu portal veterinario. Inicia sesión para gestionar tus citas y mascotas.
                </p>
            </section>

            <form class="form" method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-submit">Conectar</button>
            </form>
        </div>

        <div class="login-image-container">
            <img src="{% static 'veterinario/img/background01.jpg' %}" alt="Gatito" class="login-image">
        </div>

    </div>

</div>
{% endblock %}
