{% extends 'index.html' %}
{% load static %}

{% block content %}
<div class="pets-page-container">
    <section class="section-pets">
        <div class="pets-header">
            <h2 class="title-pet">{{ titulo }}</h2>
        </div>

        <form method="post" class="form-card">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn btn-add-pet">Guardar cita</button>
                <a class="btn" href="{% url 'citas' %}">Cancelar</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
