{% extends 'index.html' %}
{% block content %}
<h2 class="title-l">Macotas de {{ user.username }}</h2>
<ul class="list-pets">
    {% for elemento in mascotas %}
    <li class="li-pet">
        {{ elemento.name }}
    </li>
    {% endfor %}
</ul>
{% if user.is_authenticated and user.is_staff %}
<a class="btn" href="{% url 'añadir mascota' %}">Añadir Mascota</a>
{% endif %}{% endblock %}
