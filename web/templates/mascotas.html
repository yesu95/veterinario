{% extends 'index.html' %}
{% block content %}
<h2>Macotas de {{ user.username }}</h2>
<ul>
    {% for elemento in mascotas %}
    <li>
        {{ elemento.name }}
    </li>
    {% endfor %}
</ul>
{% if user.is_authenticated and user.is_staff %}
<a href="{% url 'añadir mascota' %}">Añadir Mascota</a>
{% endif %}{% endblock %}
